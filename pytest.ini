[pytest]
# Markers are registered so an unknown-mark typo surfaces as an error rather
# than a warning, and so `-m "not live"` is a reliable way to get a run that
# touches no network.
markers =
    live: hits real market-data providers; opt in with OPTIONQ_LIVE_TESTS=1
    integration: exercises several layers together, may be slow
addopts = --strict-markers
